name: Research DailyPlus Five Models v2
on:
  push:
    paths:
      - 'research_dailyplus_five_models_v2.py'
      - '.github/workflows/research_dailyplus_five_models_v2.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow scikit-learn numpy scipy
      - name: Download marcap
        run: |
          mkdir -p data
          seq 2015 2026 | xargs -I{} -P6 sh -c 'curl -L --fail --retry 3 -sS "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-{}.parquet" -o "data/marcap-{}.parquet"'
      - name: Run DailyPlus research
        run: python research_dailyplus_five_models_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: dailyplus-five-models-v2-result
          path: dailyplus_five_models_v2_result.json
