name: Research Five Models Iterative v1
on:
  push:
    paths:
      - 'research_five_models_iterative_v1.py'
      - '.github/workflows/research_five_models_iterative_v1.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow scikit-learn numpy scipy
      - name: Download marcap
        run: |
          mkdir -p data
          seq 2015 2026 | xargs -I{} -P6 sh -c 'curl -L --fail --retry 3 -sS "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-{}.parquet" -o "data/marcap-{}.parquet"'
      - name: Run five-model iterative research
        run: python research_five_models_iterative_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: five-model-iterative-v1-result
          path: five_model_iterative_v1_result.json
