name: Validate KQ-LUCR
on:
  push:
    paths:
      - 'validate_kq_lucr.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pandas pyarrow scikit-learn numpy
      - run: python validate_kq_lucr.py
      - uses: actions/upload-artifact@v4
        with:
          name: kq-lucr-results
          path: |
            result.json
            events_summary.csv
            signals_2020_2026.csv
