name: Probe Naver Mobile Trend
on:
  push:
    paths:
      - 'probe_naver_mobile_trend.py'
      - '.github/workflows/probe_naver_mobile_trend.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests
      - run: python probe_naver_mobile_trend.py
